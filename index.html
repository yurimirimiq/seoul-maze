<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seoul-maze · 코엑스</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 480px; color: #222; background: #fff; }
  h1 { margin: 0; font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin: 20px 0 8px; }
  .note { margin: 4px 0 12px; font-size: .85rem; color: #666; }
  svg { width: 100%; border: 1px solid #ccc; border-radius: 8px; background: #fafafa; }
  svg rect { fill: #e8eef7; stroke: #8aa0c0; stroke-width: .3; }
  svg text { font-size: 3px; text-anchor: middle; fill: #222; }
  #pin { fill: #e5484d; stroke: #fff; stroke-width: .6; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { display: block; width: 100%; margin-bottom: 8px; padding: 12px; text-align: left; font: inherit;
    background: #fff; border: 1px solid #ccc; border-radius: 8px; }
  li button[aria-pressed="true"] { border-color: #e5484d; background: #fff5f5; }
  li small { display: block; color: #666; }
</style>
</head>
<body>
<h1>코엑스</h1>
<p class="note">직접 그린 대략적인 약도예요. 실제 위치와 다를 수 있어요.</p>

<svg viewBox="0 0 100 70" role="img" aria-label="코엑스몰 약도">
  <rect x="6" y="4" width="26" height="9" rx="1.5"/><text x="19" y="9.7">봉은사역 (9호선)</text>
  <rect x="6" y="18" width="24" height="12" rx="1.5"/><text x="18" y="25">아쿠아리움</text>
  <rect x="50" y="8" width="24" height="12" rx="1.5"/><text x="62" y="15">메가박스</text>
  <rect x="34" y="28" width="24" height="14" rx="1.5"/><text x="46" y="36">별마당도서관</text>
  <rect x="6" y="46" width="26" height="12" rx="1.5"/><text x="19" y="53">현대백화점</text>
  <rect x="66" y="54" width="28" height="9" rx="1.5"/><text x="80" y="59.7">삼성역 (2호선)</text>
  <circle id="pin" r="2.2" display="none"/>
</svg>

<h2>지금 열리는 팝업</h2>
<ul id="list"></ul>

<script src="popups.js"></script>
<script>
  // 날짜가 YYYY-MM-DD 글자라서 글자 비교만으로 앞뒤를 가릴 수 있다.
  const isOpen = (p, today) => p.start <= today && today <= p.end;
  const t = { start: '2026-01-01', end: '2026-01-31' };
  console.assert(isOpen(t, '2026-01-01') && isOpen(t, '2026-01-31') && !isOpen(t, '2025-12-31') && !isOpen(t, '2026-02-01'), 'isOpen 자가 점검 실패');

  const today = new Date().toLocaleDateString('sv'); // 'sv' 형식 = 내 시간대 기준 YYYY-MM-DD
  const list = document.getElementById('list');
  const pin = document.getElementById('pin');
  const open = POPUPS.filter(p => isOpen(p, today));

  if (!open.length) list.textContent = '지금 열리는 팝업이 없어요.';
  for (const p of open) {
    const btn = document.createElement('button');
    btn.setAttribute('aria-pressed', 'false');
    btn.append(p.name);
    const info = document.createElement('small');
    info.textContent = `${p.near} · ${p.start} ~ ${p.end}`;
    btn.append(info);
    btn.onclick = () => {
      list.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
      pin.setAttribute('cx', p.x);
      pin.setAttribute('cy', p.y);
      pin.removeAttribute('display');
    };
    const li = document.createElement('li');
    li.append(btn);
    list.append(li);
  }
</script>
</body>
</html>
