<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<title>잠실역 | 패스파인더</title>
</head>
<body>
<a class="brand wordmark" href="./" aria-label="패스파인더 홈">pathf<span class="i">ı</span>nder</a>
<h1>잠실역</h1>

<div class="mapwrap">
  <div id="mapscroll" class="mapscroll"><svg id="map" role="img" aria-label="잠실역 롯데백화점과 롯데월드몰 실내 약도"></svg></div>
  <details class="search" name="tool">
    <summary aria-label="위치 찾기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></summary>
    <form class="finder" role="search">
      <input type="search" placeholder="가게 이름, 시설, 칸 번호" aria-label="찾을 곳" autocomplete="off">
    </form>
    <ul class="hits"></ul>
  </details>
  <details class="search route" name="tool">
    <summary aria-label="길찾기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M6 15.5V11a3 3 0 0 1 3-3h6.5"/></svg></summary>
    <form class="finder">
      <label><span>출발</span> <input type="search" placeholder="지금 있는 곳" autocomplete="off"></label>
      <button type="button">내 위치</button>
      <label><span>도착</span> <input type="search" placeholder="가려는 곳" autocomplete="off"></label>
    </form>
    <ul class="hits"></ul>
  </details>
  <p id="guide" class="guide" aria-live="polite"></p>
  <div id="floors" class="floors" role="group" aria-label="층 선택"></div>
  <button class="close" aria-label="약도만 보기 닫기" hidden>×</button>
  <div class="zoom" role="group" aria-label="약도 크기">
    <button aria-label="약도 키우기">+</button>
    <button aria-label="약도 줄이기">−</button>
  </div>
</div>
<h2>지금 열리는 팝업·행사</h2>
<ul id="now" class="events"></ul>

<section id="floor"></section>

<h2>곧 열리는 팝업·행사</h2>
<ul id="soon" class="events"></ul>

<footer>
  팝업과 행사는 2026-11-17에 <a href="https://www.lwt.co.kr/ko/event/all.do">롯데월드타워·몰 이벤트</a>에서 확인한 내용이에요.
  가게 목록과 자리, 통로 모양은 2026-11-17에 <a href="https://www.lwt.co.kr/ko/about/store-map.do">롯데월드타워·몰 빠른길찾기</a>에서 확인한 내용이에요. 바뀔 수 있으니 가기 전에 공식 안내를 확인하세요.
</footer>

<script src="jamsil/map.js"></script>
<script src="jamsil/floors.js"></script>
<script src="jamsil/stores.js"></script>
<script src="jamsil/events.js"></script>
<script src="app.js"></script>
</body>
</html>
